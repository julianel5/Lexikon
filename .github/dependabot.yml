# Keeps GitHub Actions, npm, Python and Docker dependencies up to date with monthly, grouped PRs.
# Commit prefixes produce Conventional Commit PR titles such as "build(deps): bump ...".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        update-types: [minor, patch]
    # Major jumps in the toolchain are migrations, not bumps (see #21-#24): React 19 needs
    # react-dom and the type packages together, react-hooks 7 adds lint rules that need code
    # changes, ESLint 10 depends on those plugins, and plugin-react 6 requires Vite 8. Do them
    # by hand, as planned work. Minor and patch updates and security updates still come in.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      server:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: pip
    directory: /ingest
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # The digest of the base images in the Dockerfiles. Node majors are chosen deliberately (an
  # LTS release that better-sqlite3 supports), so only minor/patch image updates are proposed.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
