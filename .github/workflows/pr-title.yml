name: PR title

# Pull requests are squash-merged and the PR title becomes the commit message on main,
# so the title must follow Conventional Commits: https://www.conventionalcommits.org
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].{0,70}$'
          # Dependabot writes long titles ("bump X from A to B in /dir in the group"); keep the
          # type and scope check for it but not the length limit.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          fi
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::The PR title must follow Conventional Commits, in English: type(scope): summary"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Examples: 'fix(web): keep the audio button on screen', 'docs: add a contributing guide'"
            echo "Got: $TITLE"
            exit 1
          fi

  # The description becomes the commit message on main, so it must say which AI tool and model
  # helped, if any (see "AI-assisted contributions" in CONTRIBUTING.md)
  ai-disclosure:
    name: ai disclosure
    # Dependabot writes its own descriptions
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that the description ends with an Assisted-by line
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          lines=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -Ei '^Assisted-by:' || true)
          if [ -n "$lines" ] && ! printf '%s\n' "$lines" | grep -Eivq '^Assisted-by: *(none|[^:]+:[^[:space:]]+) *$'; then
            echo "$lines"
          else
            echo "::error::End the description with 'Assisted-by: AGENT_NAME:MODEL_VERSION', one line per AI assistant (for example 'Assisted-by: Claude Code:claude-sonnet-5-5'), or with 'Assisted-by: none'. See 'AI-assisted contributions' in CONTRIBUTING.md."
            echo "Found: ${lines:-no Assisted-by line}"
            exit 1
          fi
