name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository
permissions:
  contents: read

# A new push to the same branch cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  ingest:
    name: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build a database from the fixture
        run: python ingest/ingest.py ingest/fixtures/sample.jsonl -o "$RUNNER_TEMP/check.db"

      - name: Check the database
        env:
          DB: ${{ runner.temp }}/check.db
        run: |
          python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect(os.environ["DB"])
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"entries", "search_keys", "autocomplete"} <= tables, tables
          for table in ("entries", "search_keys", "autocomplete"):
              n = db.execute(f"SELECT count(*) FROM {table}").fetchone()[0]
              assert n > 0, f"{table} is empty"
              print(f"{table}: {n} rows")
          PY
